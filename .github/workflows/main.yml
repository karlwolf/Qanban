name: Notify Middleware and Await External Approval

on:
  workflow_dispatch:

jobs:
  notify-and-await:
    runs-on: ubuntu-latest
    environment:
      name: approval-required

    steps:
      - name: Get GitHub Environment ID
        id: get_env_id
        run: |
          ENV_ID=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.api_url }}/repos/${{ github.repository }}/environments/approval-required" \
            | jq -r '.id')

          echo "environment_id=${ENV_ID}" >> $GITHUB_OUTPUT

      - name: Notify Middleware
        run: |
          curl -X POST https://72a6e3ddd0ff.ngrok-free.app/api/github/action \
            -H 'Content-Type: application/json' \
            -d '{
              "action_run_id": "${{ github.run_id }}",
              "environment_id": "${{ steps.get_env_id.outputs.environment_id }}"
            }'

      - name: Aguarda aprovação externa (deploy obrigatório)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ github.job_environment }}',
              required_contexts: [],
              auto_merge: false
            });

            const deploymentId = deployment.data.id;
            console.log(`Deployment criado com ID: ${deploymentId}`);

            let deploymentStatus = null;
            while (true) {
              deploymentStatus = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId
              });

              if (deploymentStatus.data.length > 0) {
                const state = deploymentStatus.data[0].state;
                console.log(`Estado atual do deployment: ${state}`);
                if (state === 'success') {
                  console.log('Deployment aprovado externamente.');
                  break;
                } else if (state === 'failure') {
                  throw new Error('Deployment rejeitado externamente.');
                }
              }

              console.log('Aguardando aprovação externa...');
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
